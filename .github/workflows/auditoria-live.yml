name: Auditoría live

# Audita la tienda Shopify publicada (zenqalife.roadshop.online) con un navegador
# real: HTTP + enlaces + catálogo, flujos de compra, capturas en móvil/tablet/
# escritorio, accesibilidad (axe) y Lighthouse. Deja la evidencia en el artefacto
# `auditoria-live` (audit-out/).
on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths-ignore:
      - "audit-out/**"     # la propia evidencia no debe re-disparar la auditoría (bucle)

permissions:
  contents: write   # para publicar la evidencia en la propia rama (los artefactos no son accesibles desde el sandbox)

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Herramientas de auditoría
        run: npm install --no-save --omit=dev --no-audit --no-fund puppeteer@24 axe-core@4 lighthouse@12 chrome-launcher@0.15

      - name: Chrome de puppeteer como CHROME_PATH
        run: |
          echo "CHROME_PATH=$(node -e "console.log(require('puppeteer').executablePath())")" >> "$GITHUB_ENV"

      - name: Auditoría
        run: node .test/live-audit.mjs
        env:
          BASE: https://zenqalife.roadshop.online

      - name: Resumen en el log
        if: always()
        run: node .test/live-audit-report.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auditoria-live
          path: audit-out/
          retention-days: 14

      - name: Sondas puntuales
        continue-on-error: true
        run: node .test/live-probe.mjs
        env:
          BASE: https://zenqalife.roadshop.online

      - name: Lighthouse, legales, contraste y peso
        continue-on-error: true
        run: node .test/live-audit2.mjs
        env:
          BASE: https://zenqalife.roadshop.online

      - name: Publicar la evidencia en la rama
        if: always()
        run: |
          set -e
          rm -f audit-out/lh-*.json          # los informes Lighthouse en crudo pesan; queda lh-summary.json
          git config user.name "auditoría zenqa"
          git config user.email "auditoria@users.noreply.github.com"
          git add -A audit-out
          git commit -m "Auditoría live: evidencia (run ${{ github.run_id }})" || echo "sin cambios que commitear"
          git push origin "HEAD:${GITHUB_REF_NAME}"
